<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HX Effects Preset Builder</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #141518; --panel-2: #1b1d21; --panel-3: #23262b; --line: #2b2e34; --line-2: #3a3e45;
    --text: #eceef1; --muted: #8d939c; --faint: #5d626a; --accent: #3fb8ff; --warn: #ff6b5b; --ok: #46c37b;
    --radius: 12px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---- top bar ---- */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px;
    background: #08090a; border-bottom: 1px solid var(--line); }
  @media (min-width: 980px) { .topbar { position: sticky; top: 0; z-index: 5; } }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .4px; font-size: 13px;
    text-transform: uppercase; color: var(--muted); margin-right: 6px; }
  .brand svg { color: var(--accent); }
  .preset-name { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px;
    font-size: 17px; font-weight: 600; width: 16ch; min-width: 0; }
  .topbar select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
  .spacer { flex: 1; }
  .btn.ic { display: inline-flex; align-items: center; gap: 6px; }
  .btn.ic:not(.primary) svg { color: var(--accent); }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; font-size: 13px; }
  .btn:hover { border-color: var(--line-2); background: var(--panel-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger:hover { border-color: var(--warn); color: var(--warn); }
  .btn-group { display: inline-flex; }
  .btn-group .btn { border-radius: 0; margin-left: -1px; }
  .btn-group .btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
  .btn-group .btn:last-child { border-radius: 0 9px 9px 0; }
  .meta { color: var(--muted); font-size: 12px; }

  /* ---- main layout ---- */
  .main { flex: 1; display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px; min-height: 0; }
  @media (min-width: 980px) { .main { grid-template-columns: 290px minmax(0, 1fr); } }
  .work { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin: 0 0 10px; font-weight: 700; }

  /* ---- sidebar: model browser ---- */
  .sidebar { display: flex; flex-direction: column; min-height: 0; order: 2; }
  @media (min-width: 980px) { .sidebar { order: 0; } }
  @media (min-width: 980px) { .sidebar { position: sticky; top: 66px; max-height: calc(100vh - 78px); } }
  .search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; margin-bottom: 10px; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; margin-bottom: 10px; }
  .grp-btn { display: flex; align-items: center; gap: 7px; background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 5px 7px; font-size: 12px; text-align: left; color: var(--muted); }
  .grp-btn svg { color: var(--c); flex: none; }
  .grp-btn:hover { background: var(--panel-2); color: var(--text); }
  .grp-btn[aria-pressed="true"] { background: var(--panel-3); border-color: var(--c); color: var(--text); }
  .models { flex: 1; min-height: 160px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px;
    border-top: 1px solid var(--line); padding-top: 8px; }
  @media (min-width: 980px) { .models { max-height: none; } }
  .model { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 7px; padding: 7px 9px; }
  .model:hover { background: var(--panel-2); }
  .param select.ir-empty { border-color: var(--warn); }
  .warn-text { color: var(--warn); }
  .fw-load { max-width: 620px; margin: 60px auto; padding: 24px; }
  .fw-load h1 { font-size: 20px; margin: 0 0 12px; }
  .fw-drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 34px 16px; margin: 16px 0;
    border: 2px dashed var(--line-2); border-radius: 14px; cursor: pointer; text-align: center; }
  .fw-drop.over, .fw-drop:hover { border-color: var(--accent); background: rgba(63,184,255,.06); }
  .side-foot a { color: var(--muted); }
  .model.nofit { opacity: .35; cursor: not-allowed; }
  .model.nofit:hover { background: transparent; }
  .model .mg { font-size: 11px; color: var(--c, var(--muted)); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty-note { color: var(--muted); padding: 8px; }
  .side-foot { margin-top: 10px; }

  /* ---- toolbar: snapshots + DSP ---- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; }
  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-size: 12px; font-weight: 600;
    letter-spacing: .3px; color: var(--muted); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #04121c; }
  .seg.channels { display: flex; margin: 8px 0; }
  .seg.channels button { flex: 1; padding: 5px 4px; }
  .label-xs { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); font-weight: 700; }
  input.mini, select.mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; }
  input.mini { width: 8em; }
  input.mini[type=number] { width: 5.5em; }
  .dsp { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .meter { width: 140px; height: 6px; background: var(--panel-3); border-radius: 3px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--ok); transition: width .2s; }
  .meter.over > div { background: var(--warn); }
  .meter-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter-label.over { color: var(--warn); }

  /* ---- signal flow ---- */
  .flow { padding: 16px 14px 12px; }
  .flow-scroll { overflow-x: auto; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(11, minmax(50px, 1fr)); grid-template-rows: 108px 108px;
    min-width: 560px; }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wires path { fill: none; stroke: #6a7079; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .wires path.idle { stroke: #3a3e45; stroke-dasharray: 5 5; }
  .wires circle { fill: #9aa1aa; }
  .io { align-self: center; justify-self: center; width: 54px; height: 54px; border-radius: 12px; background: var(--panel-2);
    border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    letter-spacing: .8px; color: var(--muted); position: relative; z-index: 1; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0;
    background: transparent; padding: 0; min-width: 0; border-radius: 12px; }
  .cell.dragover { background: rgba(63,184,255,.08); }
  .tile { width: 56px; height: 56px; border-radius: 14px; background: #0d0e10; border: 2px solid var(--c, #888);
    display: flex; align-items: center; justify-content: center; color: var(--c); position: relative; z-index: 1;
    box-shadow: 0 0 0 0 transparent; transition: box-shadow .15s, transform .1s; }
  .cell:hover .tile { transform: translateY(-1px); }
  .cell.sel .tile { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c), 0 0 18px -2px var(--c); }
  .cell.off .tile { border-style: dashed; opacity: .45; }
  .tile .stereo { position: absolute; bottom: 3px; right: 5px; font-size: 9px; font-weight: 700; color: var(--muted); }
  .tile .fs { position: absolute; top: -8px; right: -8px; background: var(--panel-3); border: 1px solid var(--line-2);
    color: var(--text); font-size: 9px; font-weight: 700; border-radius: 6px; padding: 1px 4px; }
  .cell .nm { position: absolute; bottom: 2px; left: 2px; right: 2px; font-size: 11px; color: var(--muted); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.sel .nm { color: var(--text); }
  .cell .pos { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--faint); }
  .node { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1.5px solid #3a3e45; position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; color: transparent; font-size: 15px; line-height: 1; transition: all .12s; }
  .cell:hover .node, .cell.dragover .node { border-color: var(--accent); color: var(--accent); width: 34px; height: 34px; }
  .cell.sel .node { border-color: var(--accent); color: var(--accent); width: 38px; height: 38px; border-width: 2px; }
  .junction { position: absolute; top: 25%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; z-index: 3;
    background: #b4bac2; border: 3px solid var(--panel); box-shadow: 0 0 0 1.5px #b4bac2; cursor: ew-resize; touch-action: none;
    transition: transform .12s, background .12s, box-shadow .12s; }
  .junction:hover, .junction.drag, .junction:focus-visible { transform: scale(1.35); background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), 0 0 12px var(--accent); outline: none; }
  .junction.sel { background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), 0 0 12px var(--accent); }
  .junction.idle { background: #4a4f57; box-shadow: 0 0 0 1.5px #4a4f57; }
  .flow-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .flow-foot label { display: inline-flex; align-items: center; gap: 6px; }

  /* ---- editor ---- */
  .ed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .ed-icon { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--c); color: var(--c); display: flex;
    align-items: center; justify-content: center; background: #0d0e10; }
  .ed-title { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .ed-title .title { font-size: 18px; font-weight: 700; }
  .ed-title .sub { font-size: 11px; color: var(--muted); }
  .ed-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
  .ed-opts label { display: inline-flex; align-items: center; gap: 6px; }
  .power { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--panel-2);
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .power[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); box-shadow: 0 0 12px -3px var(--c, var(--accent)); }
  .pill { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted); }
  .pill[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: rgba(63,184,255,.12); }
  .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px 12px; }
  .param { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
  .param .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .param .val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); min-height: 18px; }
  .param select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .param .switch { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 6px 16px; font-size: 12px; font-weight: 600; }
  .param .switch[aria-pressed="true"] { border-color: var(--c); color: var(--c); }
  .knob { width: 64px; height: 64px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
  .knob .track { fill: none; stroke: #2c3036; stroke-width: 5; stroke-linecap: round; }
  .knob .arc { fill: none; stroke: var(--c, var(--accent)); stroke-width: 5; stroke-linecap: round; }
  .knob .cap { fill: #17191c; stroke: #30343a; stroke-width: 1; }
  .knob .ptr { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
  .knob.ctl .arc { stroke-dasharray: 3 3; }
  .hint { color: var(--muted); }
  .hint p { margin: 0 0 8px; }
  kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .unit-only { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid currentColor;
    border-radius: 4px; padding: 0 4px; }
  .fw-note { font-size: 12px; color: var(--muted); margin: -4px 0 14px; max-width: 80ch; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); width: 100%; }
  .ctl select { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .ctl select.on { border-color: var(--accent); color: var(--accent); }
  .ctl-num { display: inline-flex; align-items: center; gap: 4px; }
  .ctl-range { width: 60px; accent-color: var(--accent); }
  .ctl-v { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--text); }
  .ctl-vals { display: flex; gap: 6px; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: center; }
  .ctl-vals .cur { color: var(--accent); font-weight: 700; }

  /* ---- misc ---- */
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #24282e; border: 1px solid var(--line-2);
    padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  #toast.show { opacity: 1; }
  .missing { max-width: 640px; margin: 60px auto; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .missing code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #fsSel { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; }
  dialog.unit { max-width: 520px; width: calc(100% - 32px); border-radius: 14px; border: 1px solid var(--line-2); padding: 18px; background: var(--panel); color: inherit; }
  dialog.unit::backdrop { background: rgba(0,0,0,.6); }
  dialog.unit h2 { margin: 0 0 8px; font-size: 18px; }
  dialog.unit p { margin: 6px 0; font-size: 14px; }
  dialog.unit select { width: 100%; font: inherit; padding: 7px; margin: 8px 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  dialog.unit .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  dialog.unit.wide { max-width: 760px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  footer.disclaimer { margin: 4px 12px 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  footer.disclaimer p { margin: 0 0 6px; }
  footer.disclaimer strong { color: var(--text); }
  footer.disclaimer a { color: inherit; }
  .subbar { display: flex; gap: 12px; align-items: flex-start; margin: 12px 12px 0; }
  .recovery { flex: 1; min-width: 0; padding: 10px 16px; font-size: 13px; }
  .to-setup { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .to-setup:hover { border-color: var(--accent); }
  @media (max-width: 700px) { .subbar { flex-direction: column; align-items: stretch; } }
  .recovery summary { cursor: pointer; font-weight: 600; color: var(--warn); }
  .howto { flex: 1; min-width: 0; padding: 10px 16px; font-size: 13px; }
  .howto summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .howto ol { margin: 10px 0 6px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
  .howto em { font-style: normal; color: var(--text); font-weight: 600; }
  .recovery ol { margin: 10px 0 6px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
  .recovery em { font-style: normal; color: var(--text); font-weight: 600; }
  .fw-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .fw-warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-radius: 10px;
    padding: 10px 12px; margin: 10px 0; }
  .fw-warn strong { color: var(--warn); }
  dialog.unit .fw-warn p { font-size: 13px; }
  .fw-warn label { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; margin-top: 8px; cursor: pointer; }
  .fw-warn input { margin-top: 3px; accent-color: var(--warn); }
  .unit-presets { max-height: min(60vh, 560px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 10px 0; padding-right: 4px; }
  .unit-presets .bank { display: grid; grid-template-columns: 28px repeat(4, minmax(0, 1fr)); gap: 4px; align-items: stretch; }
  .unit-presets .bn { color: var(--faint); font-size: 12px; text-align: right; padding-right: 4px; align-self: center; }
  .unit-presets .slot { display: flex; gap: 6px; align-items: baseline; min-width: 0; text-align: left; padding: 6px 8px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line); }
  .unit-presets .slot:hover:not(:disabled) { border-color: var(--accent); }
  .unit-presets .slot .sl { color: var(--muted); font-size: 11px; flex: none; }
  .unit-presets .slot .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unit-presets .slot.empty { background: transparent; color: var(--faint); }
  .unit-presets .slot.cur { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--panel-2)); }
  .unit-presets .slot:disabled { cursor: default; }
  .unit-presets.busy .slot { opacity: .6; }
  dialog.unit .log { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
<!-- ?v=: change it whenever these files change, so a browser never runs an old copy beside a new page -->
<script src="preset-core.js?v=20261127b"></script>
<script src="fw-reader.js?v=20261122b"></script>
<script src="fw-catalog.js?v=20261127a"></script>
<script src="real-names.js?v=20261127a"></script>
<script>
"use strict";
// The setup page's files (flasher.js, firmware-core.js, the recipes): beside this page's folder on the website,
// in web/ when served from the repository (python3 -m http.server from the repo root, README).
const WEB = location.pathname.includes("/tools/preset-builder/") ? "../../web/" : "../";
const app = document.getElementById("app");
const loadScript = src => new Promise((ok, fail) => {
  const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("could not load " + src));
  document.head.append(s);
});

// ---------- constants ----------
// HX Effects only: one DSP, nine blocks on each of path A and path B of dsp0 (see docs/hxedit-preset-format.md)
const SLOTS = 9;
const DEVICES = {
  hfx: { label: "HX Effects", rows: 2 },
};
const GROUPS = ["Distortion","Dynamics","EQ","Modulation","Delay","Reverb","Pitch/Synth","Filter","Wah",
                "Amp","Preamp","Cab","IR","Volume/Pan","Send/Return","Looper"];
const COLORS = {
  "Distortion":"#f5901e","Dynamics":"#e3cf2a","EQ":"#b8bec6","Modulation":"#3d94f0","Delay":"#33c27a",
  "Reverb":"#e7739a","Pitch/Synth":"#a07bff","Filter":"#cf74e0","Wah":"#c98a4b","Amp":"#ff5a4e",
  "Preamp":"#ff8a7a","Cab":"#e0a080","IR":"#8fb57a","Volume/Pan":"#86aec4","Send/Return":"#a5a8d6","Looper":"#d9b24c",
};
// the firmware's model categories -> the browser's groups
const CATEGORY_GROUP = {

    if (vt === 0 && Object.keys(labels).length) p.labels = labels;

// (same display name). A custom effect takes over a stock model's mono version only, so then they stand apart.
function buildModels(build) {

    // a cab goes by its name in the unit's Cabs menu (the model data names four of them "4x12 SoloLead EM")
    const display = (fm.category === "cab" && (window.CAB_MENU_NAMES || {})[name]) || fm.display;
    const key = base + "|" + display;

    groups.get(key).variants[kind || "only"] = name;

    const main = cat[mono || stereo];

    let id = g.base;
    const sameBase = [...groups.values()].filter(x => x.base === g.base);
    if (sameBase.length > 1 && !(stock[stereo || mono] && stock[stereo || mono].display === g.display)) id = mono || stereo;
    if (taken.has(id)) id = mono || stereo;

      params.push({ symbolicID: "@trails", name: "Trails", valueType: 2, min: false, max: true, default: false, labels: { 0: "Off", 1: "On" } });
    if (main.btype === CAB_TYPE)

                       labels: Object.fromEntries(MICS.map((n, k) => [k, n])) });
    const firstBuild = BUILD_ORDER.find(b => FWCAT[b] && FWCAT[b][mono || stereo] &&
      (FWCAT[b][mono || stereo].display === g.display || (window.CAB_MENU_NAMES || {})[mono || stereo] === g.display));
    const m = { id, name: g.display, group: g.group, amp: g.group === "Amp" || g.group === "Preamp",
                mono: !!mono, stereo: !!stereo, fwNames: { mono, stereo }, btype: main.btype,
                legacy: !!((mono && cat[mono].legacy) || (stereo && cat[stereo].legacy)),
                load: mono ? cat[mono].cost / COST_PER_PERCENT : null, loadStereo: stereo ? cat[stereo].cost / COST_PER_PERCENT : null, params };
    if (firstBuild && firstBuild !== "stock") m.fw = { build: firstBuild };

    const real = (window.REAL_NAMES || {})[m.name];

// IndexedDB: the catalogue read from the firmware stays in this browser, so the file is needed once
const DB = {
  open: () => new Promise((ok, fail) => {
    const r = indexedDB.open("hx-preset-builder", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("fw");
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  }),
  async get(k) { const db = await DB.open(); return new Promise((ok, fail) => { const q = db.transaction("fw").objectStore("fw").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => fail(q.error); }); },
  async put(k, v) { const db = await DB.open(); return new Promise((ok, fail) => { const t = db.transaction("fw", "readwrite"); t.objectStore("fw").put(v, k); t.oncomplete = ok; t.onerror = () => fail(t.error); }); },
  async del(k) { const db = await DB.open(); return new Promise(ok => { const t = db.transaction("fw", "readwrite"); t.objectStore("fw").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};
const CAT_KEY = "catalog-v2";      // v2: models carry the firmware's legacy flag (v1 is dropped)

// Read the stock file and the three builds the setup page makes from it (their recipes), then keep the result.
async function readFirmware(file, say) {
  const md5 = b => SparkMD5.ArrayBuffer.hash(b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength));
  const env = { pako, md5 };
  const stock = new Uint8Array(await file.arrayBuffer());
  say("Reading the stock firmware…");
  const arc = FIRMWARE.stockArchive(stock, pako);
  const recipes = {};
  for (const b of ["nam", "amps", "full"]) {
    const r = await fetch(WEB + `recipe-${b}.bin`);
    if (!r.ok) throw new Error(`recipe-${b}.bin not found`);
    recipes[b] = new Uint8Array(await r.arrayBuffer());
  }
  if (md5(arc) !== FIRMWARE.parseRecipe(pako.inflate(recipes.nam)).stockMd5)
    throw new Error("That isn't Line 6's HX Effects 3.80.0 firmware (HX_Effects_v3.80.0_0xd97239907.hxf).");
  const cat = { stock: FWREAD.read(arc) };
  if (!Object.values(cat.stock).some(m => m.legacy === true))
    throw new Error("The page's firmware reader is out of date in this browser: reload the page (Shift+reload) and try again.");
  for (const b of ["nam", "amps", "full"]) {
    say(`Working out the ${BUILDS[b]}…`);
    await new Promise(r => setTimeout(r, 0));
    cat[b] = FWREAD.read(FIRMWARE.archive(stock, recipes[b], env));
  }
  await DB.put(CAT_KEY, cat).catch(() => {});
  return cat;
}

function renderLoader(msg) {
  const log = el("p", { class: "meta", id: "fwLog" }, msg || "");
  const pick = el("input", { type: "file", accept: ".hxf", id: "fwFile", class: "visually-hidden",
    onchange: e => { const f = e.target.files[0]; if (f) go(f); e.target.value = ""; } });
  const drop = el("label", { class: "fw-drop", for: "fwFile",
      ondragover: e => { e.preventDefault(); e.currentTarget.classList.add("over"); },
      ondragleave: e => e.currentTarget.classList.remove("over"),
      ondrop: e => { e.preventDefault(); e.currentTarget.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) go(f); } },
    el("strong", {}, "Drop HX_Effects_v3.80.0_0xd97239907.hxf here"), el("span", { class: "meta" }, "or click to choose it"));
  async function go(f) {
    const say = t => { log.textContent = t; };
    try {
      setCatalog(await readFirmware(f, say));
      start();
    } catch (e) { say("Stopped: " + (e.message === "notHxf" ? "that isn't a firmware (.hxf) file." : e.message)); }
  }
  app.replaceChildren(el("div", { class: "fw-load panel" },
    el("h1", {}, "HX Effects Preset Builder"),
    el("p", {}, "The builder reads the models, their knobs and their settings from Line 6's firmware for the HX Effects: the same file the setup page asks for. Give it the file once; this browser keeps what it reads."),
    pick, drop, log,
    el("p", { class: "meta" }, "The file stays on your computer: nothing is uploaded. Download it from Line 6 (HX Effects, firmware 3.80.0) if you don't have it.")));
}

function formatValue(p, v) {

  if (p.labels && p.labels[String(Math.round(v))] != null) return p.labels[String(Math.round(v))];
  if (p.minString && v <= p.min) return p.minString;
  if (p.maxString && v >= p.max) return p.maxString;
  if (p.midString && Math.abs(v - (p.min + p.max) / 2) < (p.max - p.min) / 400) return p.midString;
  const unit01 = p.min === 0 && p.max <= 1.0001;
  const side = (v, a, b) => { const c = (v - 0.5) * 200; return Math.abs(c) < 0.5 ? "Center" : (c < 0 ? `${a} ${fix(-c, 0)}` : `${b} ${fix(c, 0)}`); };
  switch (p.displayType) {
    case "knob": return unit01 ? fix(v * 10, 1) : fix(v, 1);
    case "percent": return (unit01 ? fix(v * 100, 0) : fix(v, 0)) + "%";
    case "db": case "volume": return `${v > 0 ? "+" : ""}${fix(v, 1)} dB`;
    case "hz": return v >= 1000 ? `${fix(v / 1000, v >= 10000 ? 1 : 2)} kHz` : `${fix(v, v < 100 ? 1 : 0)} Hz`;
    case "time": case "rt60": return v < 1 ? `${fix(v * 1000, 0)} ms` : `${fix(v, v < 10 ? 2 : 1)} s`;
    case "timeAB": return `${v > 0 ? "+" : ""}${fix(v * 1000, 1)} ms`;
    case "pan": case "blend": return side(v, "Left", "Right");
    case "abpan": return side(v, "A", "B");
    case "inches": return `${fix(v, 1)} in`;
    case "micAngle": return `${fix(v, 0)}°`;
    case "micPosition": return fix(v * 10, 1);
    case "tenths": return fix(v, 1);
    case "ratio": return `${fix(v, 1)}:1`;
    case "stepsAndCents": return `${v > 0 ? "+" : ""}${fix(v, 1)}`;
  }
  return p.valueType === 0 ? String(Math.round(v)) : unit01 ? fix(v * 10, 1) : fix(v, 2);
}
const fromCentre = p => ["pan", "blend", "abpan"].includes(p.displayType);

// ---------- rendering ----------
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(c));
  return n;
};

// The chain as a signal-flow diagram: In, nine places, Out on path A; path B leaves after the split and rejoins at the
// merge. Grid columns: 0 In, 1..9 the places, 10 Out (the wires' SVG uses 100 units a column, 100 a row).
function renderChain() {
  const pathB = state.rows[1].some(Boolean);
  const wires = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  wires.setAttribute("class", "wires"); wires.setAttribute("viewBox", "0 0 1100 200"); wires.setAttribute("preserveAspectRatio", "none");
  wires.innerHTML = `<path d="M50 50H1050"/><path class="${pathB ? "" : "idle"}" d="${bWire(state.split, state.merge)}"/>`;
  const bPath = wires.children[1];
  const grid = el("div", { class: "grid" });
  const handles = [junction("split", grid, bPath), junction("merge", grid, bPath)];
  const cells = [
    el("div", { class: "io", style: "grid-column:1;grid-row:1" }, "IN"),
    el("div", { class: "io", style: "grid-column:11;grid-row:1" }, "OUT"),
  ];
  state.rows.forEach((row, ri) => row.forEach((b, s) => cells.push(renderSlot(b, ri, s))));
  const span = bSpan();
  const splitSel = el("select", { class: "mini", id: "splitSel",
      onchange: e => { state.split = +e.target.value; if (state.merge <= state.split) state.merge = state.split + 1; render(); } },
    Array.from({ length: SLOTS }, (_, i) => el("option", { value: i + 1, selected: state.split === i + 1, disabled: !!span && i + 1 > span[0] }, `before ${i + 1}`)));
  const mergeSel = el("select", { class: "mini", id: "mergeSel",
      onchange: e => { state.merge = +e.target.value; if (state.split >= state.merge) state.split = state.merge - 1; render(); } },
    Array.from({ length: SLOTS }, (_, i) => el("option", { value: i + 2, selected: state.merge === i + 2, disabled: !!span && i + 2 < span[1] }, `after ${i + 1}`)));
  return el("section", { class: "panel flow", "aria-label": "Signal chain" },
    el("div", { class: "flow-scroll" }, (grid.append(wires, ...cells, ...handles), grid)),
    el("div", { class: "flow-foot" },
      el("span", {}, `${state.rows.flat().filter(Boolean).length} blocks`),
      el("span", {}, pathB ? "Path B (lower) runs in parallel:" : "Put a block on the lower line for a parallel path B:"),
      el("label", {}, "Split", splitSel), el("label", {}, "Merge", mergeSel),
      el("span", { class: "spacer" }),
      el("span", {}, "Drag blocks, and the split and merge points, to change the routing")));
}
// path B's wire: down from the split, along the lower row, up into the merge (100 SVG units a column)
function bWire(split, merge) {
  const sx = split * 100, mx = merge * 100, r = 14;
  return `M${sx} 50V${150 - r}Q${sx} 150 ${sx + r} 150H${mx - r}Q${mx} 150 ${mx} ${150 - r}V50`;
}
// The split or merge point on path A, dragged sideways between the places (or moved with the arrow keys). It snaps
// to the gaps between blocks and can't pass the other point or leave a path B block outside.
function junction(kind, grid, bPath) {
  const isSplit = kind === "split";
  const limits = () => {
    const span = bSpan();
    return isSplit ? [1, Math.min(span ? span[0] : SLOTS, state.merge - 1)] : [Math.max(span ? span[1] : 2, state.split + 1), SLOTS + 1];
  };
  const val = () => isSplit ? state.split : state.merge;
  const h = el("div", { id: kind + "Point", class: "junction" + (state.rows[1].some(Boolean) ? "" : " idle"), tabindex: "0", role: "slider",
    "aria-label": isSplit ? "Split point" : "Merge point", "aria-valuemin": limits()[0], "aria-valuemax": limits()[1],
    title: isSplit ? "Split: drag to where path B leaves path A; click for its settings" : "Merge: drag to where path B rejoins path A; click for its mix" });
  const place = () => {
    h.style.left = `${val() * 100 / 11}%`;
    h.setAttribute("aria-valuenow", val());
    h.setAttribute("aria-valuetext", isSplit ? `before block ${val()}` : `after block ${val() - 1}`);
    bPath.setAttribute("d", bWire(state.split, state.merge));
  };
  const set = k => {
    const [lo, hi] = limits();
    k = Math.min(hi, Math.max(lo, k));
    if (k === val()) return false;
    if (isSplit) state.split = k; else state.merge = k;
    place(); return true;
  };
  place();
  let dragging = false, moved = false;
  if (state.sel.flow === kind) h.classList.add("sel");
  h.addEventListener("pointerdown", e => { dragging = true; moved = false; h.setPointerCapture(e.pointerId); h.classList.add("drag"); e.preventDefault(); });
  h.addEventListener("pointermove", e => {
    if (!dragging) return;
    const r = grid.getBoundingClientRect();
    if (set(Math.round((e.clientX - r.left) / (r.width / 11)))) moved = true;
  });
  const end = () => { if (dragging) { dragging = false; if (!moved) state.sel = { ...state.sel, flow: kind }; render(); } };
  h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
  h.addEventListener("keydown", e => {
    const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (d) { e.preventDefault(); e.stopPropagation(); if (set(val() + d)) render(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.sel = { ...state.sel, flow: kind }; render(); }
  });
  return h;
}

function renderSlot(b, r, s) {
  const sel = !state.sel.flow && state.sel.row === r && state.sel.slot === s;
  const m = b && byId[b.model];
  const attrs = {
    id: `slot-${r}-${s}`,
    class: "cell" + (sel ? " sel" : "") + (m && !b.enabled ? " off" : ""),
    style: `grid-column:${s + 2};grid-row:${r + 1};` + (m ? `--c:${COLORS[m.group]}` : ""),
    title: m ? `${m.name}${b.enabled ? "" : " (bypassed)"}` : "Empty: pick a model to put here",
    "aria-label": `${r ? "Path B" : "Path A"} slot ${s + 1}: ${m ? m.name + (b.enabled ? "" : ", bypassed") : "empty"}`,
    "aria-pressed": sel ? "true" : "false",
    draggable: m ? "true" : "false",
    onclick: () => { state.sel = { row: r, slot: s }; render(); },
    ondblclick: () => { if (b) toggleOn(b); },
    ondragstart: e => { e.dataTransfer.setData("text/plain", `${r},${s}`); e.dataTransfer.effectAllowed = "move"; },
    ondragover: e => { e.preventDefault(); e.currentTarget.classList.add("dragover"); },
    ondragleave: e => e.currentTarget.classList.remove("dragover"),
    ondrop: e => {
      e.preventDefault();
      const [fr, fs] = e.dataTransfer.getData("text/plain").split(",").map(Number);
      if (Number.isInteger(fr) && Number.isInteger(fs)) moveBlock(fr, fs, r, s);
    },
  };
  if (!m) return el("button", attrs, el("span", { class: "node" }, "+"));
  return el("button", attrs,
    el("span", { class: "tile" }, icon(m.group),
      b.stereo ? el("span", { class: "stereo" }, "ST") : null,
      b.fs ? el("span", { class: "fs" }, `FS${b.fs}`) : null),
    el("span", { class: "nm" }, m.name));
}

// Why block b can't go in at row/slot (replacing what's there), or null: the one DSP both paths share, and the amp limit

  const m = byId[b.model], before = presetLoad(others).load, after = presetLoad([...others, b]);
  if (after.load > 100) {
    const need = after.load - before;
    return `Not enough DSP: ${m.name}${b.stereo ? " (stereo)" : ""} needs ≈ ${need.toFixed(1)}%` +
      (after.swap && isOverlay(b) ? ` with the overlay copying (${after.overlays} overlays, ${OVERLAY_SWAP}% each)` : "") +
      `, ${Math.max(0, 100 - before).toFixed(1)}% is free.`;

  if (isCab(m) && others.filter(x => isCab(byId[x.model])).length >= CAB_LIMIT) return `The unit takes at most ${CAB_LIMIT} cabs per preset.`;

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- the unit's presets: click one and the unit switches to it, and the editor opens it ----------
async function unitPresets() {
  if (!navigator.usb) { toast("Reaching the unit needs Chrome or Edge (WebUSB)."); return; }
  if (!fwTable()) { toast(`No model table for the ${BUILDS[state.build]}.`); return; }
  const dlg = el("dialog", { class: "unit wide" });
  const log = el("div", { class: "log" });
  const say = t => { log.textContent += t + "\n"; log.scrollTop = log.scrollHeight; };
  const grid = el("div", { class: "unit-presets" }, el("p", {}, "Connecting…"));
  const switchUnit = el("input", { type: "checkbox", id: "switchUnit", checked: ui.switchUnit !== false,
    onchange: e => { ui.switchUnit = e.target.checked; } });
  dlg.append(el("h2", {}, "Presets on the HX Effects"),
    el("p", {}, "Click a preset to open it here. Quit HX Edit and Line 6 Updater first: they hold the USB connection."),
    el("p", {}, switchUnit, el("label", { for: "switchUnit" }, " Switch the unit to it too")),
    grid, log,
    el("div", { class: "row-btns" }, el("button", { class: "btn", onclick: () => dlg.close() }, "Close")));
  document.body.append(dlg);
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
  let list, cur = null, busy = false;
  try {
    [list, cur] = await unitSession(async api => [await api.presetList(), (await api.current()).index]);
  } catch (e) {
    grid.replaceChildren();
    say(/no device chosen/.test(e.message) ? "No unit chosen. Close this and click Unit presets again to pick the HX Effects."
      : "Could not reach the unit: " + e.message + (usbHint(e) || " (quit HX Edit first)"));
    return;
  }
  const names = new Map(list.map(p => [p.index, p.name]));
  const draw = () => {
    grid.classList.toggle("busy", busy);
    const banks = [];
    for (let b = 0; b * 4 < Math.max(128, list.length); b++) {
      banks.push(el("div", { class: "bank" }, el("span", { class: "bn" }, String(b + 1)), [0, 1, 2, 3].map(k => {
        const n = b * 4 + k, nm = names.get(n), empty = !nm || nm === "New Preset";
        return el("button", { class: "slot" + (empty ? " empty" : "") + (n === cur ? " cur" : ""), disabled: empty || busy,
          title: empty ? `${slotLabel(n)}: empty` : `${slotLabel(n)} ${nm}` + (n === cur ? " (loaded on the unit)" : ""),
          "aria-current": n === cur ? "true" : null, onclick: () => pick(n) },
          el("span", { class: "sl" }, slotLabel(n)), el("span", { class: "nm" }, empty ? "–" : nm));
      })));
    }
    grid.replaceChildren(...banks);
  };
  const pick = async n => {
    if (busy) return;
    const dirty = state.rows.flat().some(Boolean) && editorSig() !== ui.cleanSig;
    if (dirty && !confirm(`Open ${slotLabel(n)} "${names.get(n)}"? What's in the editor now hasn't been sent or saved and will be replaced.`)) return;
    busy = true; draw();
    const sw = switchUnit.checked;
    try {
      let irList = null;
      // read first, then load: after a load the unit saves the preset's running copy into its slot
      const blob = await unitSession(async api => {
        const x = await api.presetRead(n);
        try { irList = await api.list(); } catch (e) { /* IR names are optional */ }
        if (x && sw) await api.presetLoad(n);
        return x;
      });
      if (irList) keepIrList(irList);
      if (!blob) { say(`${slotLabel(n)} is empty.`); return; }
      const r = loadFromBlob(blob);
      state.name = names.get(n);
      state.unitSlot = n;
      if (sw) cur = n;
      render();
      ui.cleanSig = editorSig();
      say(`${sw ? "Loaded" : "Opened"} ${slotLabel(n)} ${names.get(n)}${sw ? " on the unit and here" : " here (the unit stays where it is)"}.`);
      if (r.skipped) say(`${r.skipped} block(s) outside the two paths not shown.`);
      if (r.unknown) say(`${r.unknown} block(s) not in the ${BUILDS[state.build]}: change "Your unit runs" and open it again.`);
    } catch (e) {
      say("Stopped: " + e.message + usbHint(e));
    } finally { busy = false; draw(); }
  };
  draw();
  grid.querySelector(".slot.cur")?.scrollIntoView({ block: "center" });
}

async function unitDialog() {

  if (!fwTable()) { toast(`No model table for the ${BUILDS[state.build]}.`); return; }
  const r = buildSpec();
  if (!r.spec.blocks.length) { toast("Add at least one block first."); return; }
  if (r.problems.length) { toast(r.problems[0]); return; }
  const all = state.rows.flat().filter(Boolean);
  const load = presetLoad(all).load;
  const amps = all.filter(b => isAmp(byId[b.model])).length;
  if (load > 100 || amps > AMP_LIMIT) { toast("Too much for the unit's DSP: take a block out first."); return; }
  const spec = r.spec;
  const dlg = el("dialog", { class: "unit" });
  const log = el("div", { class: "log" });
  const say = t => { log.textContent += t + "\n"; log.scrollTop = log.scrollHeight; };
  const sel = el("select", { id: "unitSlot", disabled: true }, el("option", {}, "Connecting…"));
  const go = el("button", { class: "btn primary", disabled: true }, "Send");
  const loadAfter = el("input", { type: "checkbox", id: "loadAfter", checked: true });
  // The page can't ask the unit which firmware it runs (it reports the same version and build id on every build), so
  // the person confirms it on every send. On other firmware a preset's blocks can be other effects with these knob
  // values, or models the unit doesn't have.
  const fwName = BUILDS[state.build];
  const extra = [...new Set(all.map(b => byId[b.model]).filter(m => m && m.fw && m.fw.build).map(m => m.name))];
  const fwOk = el("input", { type: "checkbox", id: "fwOk", onchange: () => { go.disabled = !fwOk.checked || !listed; } });
  let listed = false;
  dlg.append(el("h2", {}, "Send to the HX Effects"),
    el("div", { class: "fw-warn", role: "alert" },
      el("p", {}, el("strong", {}, `This preset is built for the ${fwName}.`)),
      el("p", {}, "Sending is your own decision and your responsibility; no liability is accepted (disclaimer at the foot of the page). " +
        "Only send it to a unit running exactly that firmware. The page can't check what your unit runs. " +
        "On any other firmware the preset can load wrong: blocks can turn into different effects with nonsense settings, " +
        "or load with nothing running, and a bad preset can lock up the unit until it's switched off and on " +
        "(\"If a preset locks up the unit\", at the top of the page, says how to get it back). " +
        "Not sure what your unit runs? The setup page (link at the top) builds and installs this repo's firmware."),
      extra.length ? el("p", {}, `It uses ${extra.length === 1 ? "a model" : extra.length + " models"} that only this repo's firmware has: ` +
        extra.slice(0, 6).join(", ") + (extra.length > 6 ? ", …" : "") + ".") : null,
      el("label", { for: "fwOk" }, fwOk, `My HX Effects runs the ${fwName}.`)),
    el("p", {}, "Quit HX Edit and Line 6 Updater first: they hold the USB connection. Chrome asks which device to use the first time."),
    sel,
    el("p", {}, loadAfter, el("label", { for: "loadAfter" }, " Load it on the unit afterwards")),
    log,
    el("div", { class: "row-btns" }, el("button", { class: "btn", onclick: () => dlg.close() }, "Close"), go));
  document.body.append(dlg);
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
  const session = unitSession;
  let list;
  try {
    list = await session(api => api.presetList());
  } catch (e) { say("Could not reach the unit: " + e.message + usbHint(e)); return; }
  sel.replaceChildren(...list.map(p => el("option", { value: p.index }, `${slotLabel(p.index)}  ${p.name}`)));
  sel.disabled = false; listed = true; go.disabled = !fwOk.checked;
  // the slot the editor's preset came from (Unit presets), else the first empty one
  const from = list.find(p => p.index === state.unitSlot), free = list.find(p => p.name === "New Preset");
  if (from || free) sel.value = (from || free).index;
  go.onclick = async () => {
    const n = +sel.value, target = list.find(p => p.index === n);
    go.disabled = true; sel.disabled = true;
    try {
      if (target.name !== "New Preset" && !confirm(`Replace ${slotLabel(n)} "${target.name}" on the unit?`)) { go.disabled = !fwOk.checked; sel.disabled = false; return; }
      await session(async api => {
        const isPreset = b => b && b.length > 10 && String.fromCharCode(...b.slice(1, 9)) === "l6-helix";
        let base = await api.presetRead(n);
        if (!isPreset(base)) base = await api.presetRead(0);   // an empty (or damaged) slot: build on 1A's settings
        let irs = {};
        if (spec.blocks.some(b => fwTable()[b.model][1] === 19)) {
          const l = await api.list();
          for (const e of l) if (e.md5) irs[e.slot] = e.md5;
          keepIrList(l);
        }
        const blob = PRESET.build(base, spec, fwTable(), irs);
        say(`Built ${blob.length} bytes; writing ${slotLabel(n)}…`);
        // The unit now and then stores a write with its start scrambled; writing again has fixed it every time.
        // A damaged copy is never loaded: a scrambled preset can freeze the unit, also at its next start-up.
        let same = false;
        for (let k = 0; k < 3 && !same; k++) {
          if (k) { say(`It read back differently; writing ${slotLabel(n)} again…`); await sleep(1000); }
          await api.presetWrite(n, blob, spec.name, sleep);
          const back = await api.presetRead(n);
          same = !!back && back.length === blob.length && back.every((x, i) => x === blob[i]);
        }
        if (!same) throw new Error(`${slotLabel(n)} still reads back differently after three writes, so it was not loaded. ` +
                                   "Don't load that slot on the unit; switch the unit off and on, then send again.");
        say("Written and read back: identical.");
        if (loadAfter.checked) { await api.presetLoad(n); say(`Loaded ${slotLabel(n)} on the unit.`); }
      });
      state.unitSlot = n; save();
      ui.cleanSig = editorSig();
      toast(`Sent to ${slotLabel(n)}.`);
    } catch (e) {
      say("Stopped: " + e.message + usbHint(e));
    }
    go.disabled = !fwOk.checked; sel.disabled = false;
  };
}

// ---------- keyboard ----------
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeSelected(); }
  const { row, slot } = state.sel;
  if (e.key === "ArrowRight" && slot < SLOTS - 1) { state.sel = { row, slot: slot + 1 }; render(); }
  if (e.key === "ArrowLeft" && slot > 0) { state.sel = { row, slot: slot - 1 }; render(); }
  if (e.key === "ArrowDown" && row < state.rows.length - 1) { e.preventDefault(); state.sel = { row: row + 1, slot }; render(); }
  if (e.key === "ArrowUp" && row > 0) { e.preventDefault(); state.sel = { row: row - 1, slot }; render(); }
});

// ---------- start: the model data from this browser's store, else from the firmware file ----------
function start() {
  if (!FWCAT[state.build]) state.build = "full";
  setModels(state.build);
  try { adoptState(JSON.parse(localStorage.getItem(STORE_KEY) || "null")); } catch (e) { /* start fresh */ }
  if (!FWCAT[state.build]) state.build = "full";
  setModels(state.build);
  render();
}
// fw-catalog.js (make_catalog.js): the model tables extracted from the firmware and this repo's builds of it, each
// build as its differences from the one before. With it the page needs no firmware file; without it (not generated
// yet) the page falls back to reading the person's file.
const CATALOG_ORDER = ["stock", "nam", "amps", "full"];
function expandCatalog(c) {
  const cat = { stock: c.stock };
  for (let i = 1; i < CATALOG_ORDER.length; i++) {
    const d = c[CATALOG_ORDER[i]], m = { ...cat[CATALOG_ORDER[i - 1]], ...d.changed };
    for (const n of d.removed) delete m[n];
    cat[CATALOG_ORDER[i]] = d.order ? Object.fromEntries(d.order.map(n => [n, m[n]])) : m;
  }
  return cat;
}
async function forgetFirmware() {
  if (!confirm("Forget the models read from the firmware? You'll need to give the page the firmware file again.")) return;
  await DB.del(CAT_KEY);
  location.reload();
}
(async () => {
  try {
    await Promise.all([loadScript(WEB + "flasher.js?v=20261122b"), loadScript(WEB + "firmware-core.js")]);
  } catch (e) { app.textContent = "This page couldn't load its files: " + e.message; return; }
  let cat = null;
  try { cat = await DB.get(CAT_KEY); } catch (e) { /* no IndexedDB: read the file each visit */ }
  if (window.FW_CATALOG) { setCatalog(expandCatalog(window.FW_CATALOG)); start(); return; }   // the usual case
  if (cat && cat.stock && cat.full) { setCatalog(cat); start(); }
  else {
    let old = null;
    try { old = await DB.get("catalog-v1"); if (old) await DB.del("catalog-v1"); } catch (e) { /* none */ }
    renderLoader(old ? "This version of the page also reads which models are Legacy: give it the firmware file once more." : undefined);
  }
})();
</script>
</body>
